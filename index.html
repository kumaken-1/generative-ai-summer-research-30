<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="初心者の教職員が生成AIを気軽に試せる、夏休み限定の30個のミニクエストです。">
    <title>夏休み限定｜生成AI 夏の自由研究30</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/print.css" media="print">
  </head>
  <body>
    <a class="skip-link" href="#main">本文へスキップ</a>

    <header class="hero">
      <div class="hero__inner">
        <p class="eyebrow">夏休み限定</p>
        <h1>生成AI 夏の自由研究30</h1>
        <p class="hero__lead">30の『ちょっと試してみる』から、気になるものを選ぼう。</p>
        <p class="hero__tagline">ちょっと聞く。もう一度頼む。最後は自分で決める。</p>
      </div>
    </header>

    <main id="main" class="site-main" tabindex="-1">
      <section class="progress-panel" aria-labelledby="progress-title">
        <h2 id="progress-title">わたしの自由研究</h2>
        <div id="progress" aria-live="polite">
          <p>挑戦したクエストは、この場所に記録されます。</p>
        </div>
      </section>

      <nav id="filters" class="filter-bar" aria-label="クエストの絞り込み">
        <p>クエストは「文字」「写真や文章」「自分の使い方」の3つのエリアから選べます。</p>
      </nav>

      <section class="quest-section" aria-labelledby="quest-title">
        <div class="section-heading">
          <p class="eyebrow">気になるものから、ひとつずつ</p>
          <h2 id="quest-title">30のクエスト</h2>
        </div>
        <div id="quest-list" class="quest-grid">
          <p class="loading-note">クエストを表示するにはJavaScriptを有効にしてください。JavaScriptが使えない場合は、印刷用のクエストマップをご利用ください。</p>
        </div>
      </section>
    </main>

    <dialog id="quest-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title">クエストの詳細</h2>
        <button id="close-dialog" type="button">閉じる</button>
      </div>
      <div id="quest-detail">
        <p>選んだクエストの進め方を表示します。</p>
      </div>
    </dialog>

    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
